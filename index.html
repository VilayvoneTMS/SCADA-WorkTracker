<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SCADA-WorkTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* ============================================================
   SCADA-WorkTracker — portal page
   Edit COMPANY / LOGO_URL / DEFAULT_MODULES in the <script> below.
   ============================================================ */
:root{
  --bg:#EEF1F5;
  --surface:#F3F5F8;
  --ink:#1E2733;
  --muted:#5B6574;
  --faint:#8A94A3;
  --light:#FFFFFF;
  --dark:rgba(163,177,198,.55);
  --teal:#0F8B8D;
  --shadow-out:8px 8px 18px var(--dark),-8px -8px 18px var(--light);
  --shadow-sm:4px 4px 10px var(--dark),-4px -4px 10px var(--light);
  --shadow-in:inset 3px 3px 7px var(--dark),inset -3px -3px 7px var(--light);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
a{color:inherit}

/* Header */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);box-shadow:0 4px 14px var(--dark);padding-top:env(safe-area-inset-top,0px)}
.topbar .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand .logo{width:34px;height:34px;flex:none}
.brand .logo img{width:100%;height:100%;object-fit:contain}
.brand .logo.wide{width:auto;height:36px}
.brand .logo.wide img{width:auto;mix-blend-mode:multiply}
.brand .co{font-weight:800;font-size:17px;letter-spacing:.01em;color:#16307A;white-space:nowrap}
.brand .co span{color:var(--teal)}
.brand .app{font-weight:600;font-size:14px;color:var(--muted);margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.brand .app{display:none}}

.nbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--shadow-sm);font-weight:600;color:var(--teal);transition:box-shadow .15s,transform .15s}
.nbtn:hover{transform:translateY(-1px)}
.nbtn:active{box-shadow:var(--shadow-in);transform:none}
.nbtn svg{width:16px;height:16px}
.nbtn.on{box-shadow:var(--shadow-in)}
.acct{display:flex;align-items:center;gap:12px}
.who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;font-size:13px;font-weight:700}
.who small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.who small.user{color:#9B7BE8}
@media (max-width:480px){.who{display:none!important}}
.hint{font-size:12.5px;color:var(--faint);margin:0}
.nbtn.editmode{letter-spacing:.06em;font-size:13px}
.nbtn.editmode[aria-pressed="true"]{background:var(--teal);color:#fff;box-shadow:var(--shadow-in)}
@media (max-width:640px){.nbtn.editmode span{display:none}}
.admin [data-key]{outline:2px dashed #7CC7C8;outline-offset:6px;border-radius:6px;cursor:text;caret-color:var(--ink)}
.admin [data-key]:focus{outline-color:var(--teal);outline-style:solid}
.admin h1[data-key]{-webkit-text-fill-color:initial;color:var(--ink);background:none}
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#12343B;color:#E6F4F3;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.editbar .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;gap:12px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.editbar .msg{font-size:13.5px;max-width:62ch}
.editbar .msg b{display:inline-block;margin-right:8px;padding:2px 8px;border-radius:6px;background:#2CC4A8;color:#0B2328;font-size:11px;letter-spacing:.1em}
.editbar .btns{display:flex;gap:8px;flex-wrap:wrap}
.editbar .nbtn{box-shadow:none;background:#1E4A52;color:#E6F4F3}
.editbar .nbtn.primary{background:#2CC4A8;color:#0B2328}
.editbar .nbtn.danger{background:#C2415D;color:#fff}
body.admin{padding-bottom:120px}
.badge .org [data-key]{display:block}
.admin .badge .org [data-key]{outline-offset:2px;margin:4px 0;padding:0 4px}
body.admin .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 120px)}

/* Hero */
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:44px 64px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.badge{display:flex;align-items:center;gap:18px;padding:16px 26px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-out);border-top:3px solid var(--teal);text-align:left;flex-wrap:wrap;justify-content:center}
.badge .logo{width:52px;height:52px}
.badge .logo img{width:100%;height:100%;object-fit:contain}
.badge .logo.wide{width:auto;height:54px;padding-right:18px;border-right:1px solid #D5DAE1}
.badge .logo.wide img{width:auto;mix-blend-mode:multiply}
@media (max-width:480px){.badge .logo.wide{border-right:0;padding-right:0}}
.badge .co{font-weight:800;font-size:26px;color:#16307A;letter-spacing:.01em}
.badge .co span{color:var(--teal)}
.badge .org{font-size:12px;color:var(--faint);line-height:1.35}
.badge .org b{display:block;color:var(--ink);font-size:13px;font-weight:700}
h1{margin:10px 0 0;font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance;
   background:linear-gradient(90deg,#0F8B8D 0%,#22B573 45%,#8FC26B 62%,#E07AA8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;max-width:62ch;color:var(--muted);font-size:17px}
.hero .nbtn{margin-top:14px;padding:13px 26px}

/* Section label */
.label{display:inline-flex;align-items:center;gap:8px;margin:64px 0 18px;padding:6px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-sm);font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.label i{width:6px;height:6px;border-radius:50%;background:#22C55E;display:inline-block}
.row-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:64px 0 18px}
.row-head .label{margin:0}
.adminbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.adminbar .note{font-size:13px;color:var(--muted);align-self:center}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px}
.card{--c:var(--teal);position:relative;display:flex;flex-direction:column;gap:12px;padding:22px 22px 20px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-out);border-top:3px solid var(--c);min-height:280px;transition:transform .18s}
.card:hover{transform:translateY(-3px)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--tint);box-shadow:var(--shadow-sm);color:var(--c)}
.ico svg{width:20px;height:20px}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--c);background:var(--tint);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);display:inline-flex;align-items:center;gap:5px}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.pill.off{color:var(--faint);background:#E6E9EE;border-color:#D5DAE1}
.card h3{margin:6px 0 0;font-size:17px;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.open{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow-sm);color:var(--c);font-weight:600;font-size:14px;text-decoration:none;border:0;transition:box-shadow .15s}
.open:hover{box-shadow:var(--shadow-in)}
.open svg{width:15px;height:15px}
.open[aria-disabled="true"]{color:var(--faint);pointer-events:none}
.edit{position:absolute;top:12px;right:12px;display:none;gap:6px}
.admin .edit{display:flex}
.admin .card .pill{visibility:hidden}
.edit button{border:0;width:32px;height:32px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow-sm);display:grid;place-items:center;color:var(--muted)}
.edit button:hover{color:var(--ink)}
.edit svg{width:15px;height:15px}
.addcard{display:flex;min-height:280px;border-radius:18px;border:2px dashed #C3CBD6;background:transparent;color:var(--teal);font-weight:700;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.addcard:hover{background:var(--surface)}
.addcard .ico{--c:var(--teal);--tint:#DDF1F1}

footer{margin-top:56px;text-align:center;font-size:12.5px;color:var(--faint)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(30,39,51,.35);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:20px;box-shadow:0 30px 80px rgba(30,39,51,.3);border-top:3px solid var(--teal)}
.modal header{padding:20px 24px 4px;font-weight:800;font-size:18px}
.modal form{padding:14px 24px 22px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.field input,.field textarea,.field select{padding:10px 12px;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--shadow-in);width:100%}
.field textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.swatches,.icons{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:var(--shadow-sm);background:var(--sw)}
.swatches button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.icons button{width:40px;height:40px;border-radius:10px;border:0;background:var(--surface);box-shadow:var(--shadow-sm);display:grid;place-items:center;color:var(--muted)}
.icons button[aria-pressed="true"]{box-shadow:var(--shadow-in);color:var(--teal)}
.icons svg{width:18px;height:18px}
.mfoot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:4px}
.mfoot .r{display:flex;gap:10px;margin-left:auto}
.nbtn.primary{background:var(--teal);color:#fff;box-shadow:4px 4px 10px var(--dark)}
.nbtn.danger{color:#C2415D}
.nbtn.danger.armed{background:#C2415D;color:#fff}
.err{color:#C2415D;font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="in">
    <a class="brand" href="#top" aria-label="Home">
      <span class="logo" data-logo></span>
      <span class="co" data-co></span>
      <span class="app" data-app></span>
    </a>
    <div class="acct">
      <span class="who" id="who" hidden></span>
      <button class="nbtn editmode" id="editBtn" type="button" hidden aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg><span>EDIT MODE</span></button>
      <button class="nbtn" id="loginTop" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>Login</span></button>
    </div>
  </div>
</header>

<main class="wrap" id="top">
  <section class="hero">
    <div class="badge">
      <span class="logo" data-logo></span>
      <span class="co" data-co></span>
      <span class="org"><span data-org data-key="org"></span><b data-section data-key="section"></b></span>
    </div>
    <h1 data-app data-key="app"></h1>
    <p class="lead" data-tagline data-key="tagline"></p>
    <button class="nbtn" id="loginHero" type="button">Admin Login</button>
  </section>

  <div class="row-head">
    <div class="label"><i></i>Modules</div>
    <button class="nbtn primary addtop" type="button" id="addTop">+ Add module</button>
  </div>
  <div class="grid" id="grid"></div>

  <footer><span data-co-plain></span> · <span data-section></span></footer>
</main>

<div class="editbar" id="adminbar" hidden>
  <div class="in">
    <div class="msg"><b>EDIT MODE</b> Click the title, subtitle, company or section text to change it. Use ✎ on a card to edit a module, ‹ to move it.</div>
    <div class="btns">
      <button class="nbtn primary" type="button" id="dlBtn">Download updated page</button>
      <button class="nbtn" type="button" id="resetBtn">Restore defaults</button>
      <button class="nbtn" type="button" id="exitBtn">Exit edit mode</button>
    </div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

const EXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><line x1="20" y1="4" x2="11" y2="13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>';
const UP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>';
const PLACEHOLDER_LOGO='<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#16307A"/><path d="M8 27c6-6 10-6 16 0s10 6 16 0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="M8 19c6-6 10-6 16 0s10 6 16 0" fill="none" stroke="#2CC4A8" stroke-width="3.5" stroke-linecap="round"/></svg>';

const STATUSES=[{k:"active",label:"Active"},{k:"live",label:"Active (live dot)"},{k:"maint",label:"Maintenance"},{k:"soon",label:"Coming soon"}];

/* ============================================================
   STATE
   ============================================================ */
const KEY="otPortal.modules.v1";
let modules=load();
let admin=false;          // edit mode (admins only)
let session=loadSession(); // {username,name,role} or null
function loadSession(){try{const s=JSON.parse(sessionStorage.getItem("otPortal.session")||"null");if(s&&ACCOUNTS.some(a=>a.username===s.username&&a.role===s.role))return s;}catch(e){}return null;}
function saveSession(){try{session?sessionStorage.setItem("otPortal.session",JSON.stringify(session)):sessionStorage.removeItem("otPortal.session");}catch(e){}}
const isAdmin=()=>session&&session.role==="admin";

/* SHA-256 (pure JS, works on http:// intranet pages too) */
function sha256Hex(str){
  const b=new TextEncoder().encode(str),K=[],H=[];
  const frac=x=>((x-Math.floor(x))*4294967296)>>>0;
  for(let n=2,c=0;c<64;n++){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break;}if(p){if(c<8)H[c]=frac(Math.pow(n,1/2));K[c]=frac(Math.pow(n,1/3));c++;}}
  const l=b.length,tot=((l+9+63)>>6)<<6,m=new Uint8Array(tot);m.set(b);m[l]=0x80;
  const dv=new DataView(m.buffer);dv.setUint32(tot-8,Math.floor(l*8/4294967296));dv.setUint32(tot-4,(l*8)>>>0);
  const w=new Uint32Array(64),r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<tot;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}
    let[a,bb,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])>>>0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;}
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+bb)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  return H.map(x=>x.toString(16).padStart(8,"0")).join("");
}
window.hashPassword=async(username,password)=>sha256Hex(`ot-portal:${String(username).trim().toLowerCase()}:${password}`);
function load(){try{const s=localStorage.getItem(KEY);if(s){const v=JSON.parse(s);
  if(Array.isArray(v)&&DATA_VERSION==="1")return v;               // older format
  if(v&&v.ver===DATA_VERSION&&Array.isArray(v.modules))return v.modules;}}catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_MODULES));}
function save(){try{localStorage.setItem(KEY,JSON.stringify({ver:DATA_VERSION,modules}));}catch(e){toast("Couldn't save in this browser (storage is blocked).");}}
const TEXT_KEY="otPortal.texts.v1", TEXT_FIELDS=["app","tagline","org","section"];
const ORIGINAL_COMPANY=JSON.parse(JSON.stringify(COMPANY));
try{const t=JSON.parse(localStorage.getItem(TEXT_KEY)||"null");if(t&&t.ver===DATA_VERSION)for(const k of TEXT_FIELDS)if(typeof t[k]==="string"&&t[k])COMPANY[k]=t[k];}catch(e){}
function saveTexts(){try{const t={ver:DATA_VERSION};for(const k of TEXT_FIELDS)t[k]=COMPANY[k];localStorage.setItem(TEXT_KEY,JSON.stringify(t));}catch(e){toast("Couldn't save in this browser (storage is blocked).");}}

/* ============================================================
   RENDER
   ============================================================ */
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function safeUrl(u){u=String(u||"").trim();if(!u)return"";if(/^(https?:)?\/\//i.test(u)||/^[\w\-./#?=&%]+$/.test(u))return u;return"";}

function applyBrand(){
  // A full logo image already contains the company name, so the text name is hidden.
  document.querySelectorAll("[data-logo]").forEach(n=>{n.classList.toggle("wide",!!LOGO_URL);n.innerHTML=LOGO_URL?`<img src="${esc(LOGO_URL)}" alt="${esc(COMPANY.org)}">`:PLACEHOLDER_LOGO;});
  document.querySelectorAll("[data-co]").forEach(n=>{n.hidden=!!LOGO_URL;n.innerHTML=`${esc(COMPANY.name)} <span>${esc(COMPANY.nameAccent)}</span>`;});
  document.querySelectorAll("[data-co-plain]").forEach(n=>n.textContent=COMPANY.org);
  document.querySelectorAll("[data-app]").forEach(n=>n.textContent=COMPANY.app);
  document.querySelectorAll("[data-org]").forEach(n=>n.textContent=COMPANY.org);
  document.querySelectorAll("[data-section]").forEach(n=>n.textContent=COMPANY.section);
  document.querySelectorAll("[data-tagline]").forEach(n=>n.textContent=COMPANY.tagline);
  document.title=COMPANY.app;
}

function render(){
  if(!isAdmin())admin=false;
  document.body.classList.toggle("admin",admin);
  $("#adminbar").hidden=!admin;
  const who=$("#who");
  if(session){who.hidden=false;who.innerHTML=`${esc(session.name)}<small class="${session.role}">${session.role==="admin"?"Admin":"User"}</small>`;}
  else who.hidden=true;
  $("#loginTop span").textContent=session?"Logout":"Login";
  const hero=$("#loginHero");
  hero.hidden=!!session;hero.textContent="Login";
  const eb=$("#editBtn");eb.hidden=!isAdmin();eb.setAttribute("aria-pressed",String(admin));
  eb.querySelector("span").textContent=admin?"EDIT MODE: ON":"EDIT MODE";
  eb.title=admin?"Turn edit mode off":"Turn edit mode on";
  document.querySelectorAll("[data-key]").forEach(n=>{if(admin){n.setAttribute("contenteditable","true");n.setAttribute("spellcheck","false");}else n.removeAttribute("contenteditable");});
  const g=$("#grid");
  g.innerHTML=modules.map((m,i)=>{
    const col=COLORS[m.color]||COLORS.teal;
    const st=STATUSES.find(s=>s.k===m.status)||STATUSES[0];
    const off=m.status==="maint"||m.status==="soon";
    const url=safeUrl(m.url);
    const pillText=m.status==="live"?"Active":st.label;
    return `<article class="card" style="--c:${col.c};--tint:${col.tint}">
      <div class="edit">
        ${i>0?`<button type="button" data-move="${i}" aria-label="Move ${esc(m.title)} earlier" title="Move earlier">${UP}</button>`:""}
        <button type="button" data-edit="${i}" aria-label="Edit ${esc(m.title)}" title="Edit">${PEN}</button>
      </div>
      <div class="top">
        <div class="ico">${svg(m.icon)}</div>
        <span class="pill ${m.status==="live"?"live":""} ${off?"off":""}">${esc(pillText)}</span>
      </div>
      <h3>${esc(m.title)}</h3>
      <p>${esc(m.desc)}</p>
      ${off||!url
        ?`<span class="open" aria-disabled="true">${EXT}${off?esc(st.label):"No link yet"}</span>`
        :(REQUIRE_LOGIN_TO_OPEN&&!session)
          ?`<button class="open" type="button" data-login>${EXT}Log in to open</button>`
          :`<a class="open" href="${esc(url)}" target="_blank" rel="noopener">${EXT}Open Module</a>`}
    </article>`;
  }).join("")+`<button class="addcard" type="button" id="addCard"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>+ Add module</button>`;
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
$("#grid").addEventListener("click",e=>{
  if(e.target.closest("[data-login]")){loginForm();return;}
  const ed=e.target.closest("[data-edit]");if(ed&&isAdmin()){moduleForm(+ed.dataset.edit);return;}
  if(e.target.closest("#addCard")){requestAdd();return;}
  if(!isAdmin())return;
  const mv=e.target.closest("[data-move]");if(mv){const i=+mv.dataset.move;[modules[i-1],modules[i]]=[modules[i],modules[i-1]];save();render();return;}
  if(e.target.closest("#addCard"))moduleForm(-1);
});
function requestAdd(){
  if(isAdmin()){moduleForm(-1);return;}
  if(session){toast("Only the admin account can add modules. Log out and log in as admin.");return;}
  loginForm(()=>{if(isAdmin())moduleForm(-1);else toast("Only the admin account can add modules.");});
}
$("#addTop").onclick=requestAdd;
$("#exitBtn").onclick=()=>{admin=false;render();};
let resetArmed=false;
$("#resetBtn").onclick=e=>{
  if(!resetArmed){resetArmed=true;e.currentTarget.textContent="Click again to restore defaults";e.currentTarget.classList.add("danger");setTimeout(()=>{resetArmed=false;$("#resetBtn").textContent="Restore defaults";$("#resetBtn").classList.remove("danger");},4000);return;}
  modules=JSON.parse(JSON.stringify(DEFAULT_MODULES));save();
  Object.assign(COMPANY,ORIGINAL_COMPANY);try{localStorage.removeItem(TEXT_KEY);}catch(e){}applyBrand();
  resetArmed=false;$("#resetBtn").textContent="Restore defaults";$("#resetBtn").classList.remove("danger");render();toast("Defaults restored");
};
$("#loginTop").onclick=()=>{
  if(session){session=null;admin=false;saveSession();render();toast("Logged out");}
  else loginForm();
};
$("#loginHero").onclick=()=>loginForm();
$("#editBtn").onclick=()=>{if(!isAdmin())return;admin=!admin;render();toast(admin?"Edit mode on":"Edit mode off. Changes are saved in this browser.");};

/* Inline text editing (edit mode) */
document.querySelectorAll("[data-key]").forEach(n=>{
  n.addEventListener("keydown",e=>{if(!admin)return;if(e.key==="Enter"){e.preventDefault();n.blur();}if(e.key==="Escape"){n.textContent=COMPANY[n.dataset.key];n.blur();}});
  n.addEventListener("paste",e=>{if(!admin)return;e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData("text").replace(/\s+/g," ");document.execCommand("insertText",false,t);});
  n.addEventListener("blur",()=>{if(!admin)return;const k=n.dataset.key,v=n.textContent.replace(/\s+/g," ").trim();
    if(!v){n.textContent=COMPANY[k];toast("Text can't be empty.");return;}
    if(v!==COMPANY[k]){COMPANY[k]=v;saveTexts();applyBrand();toast("Text updated");}});
});

/* Download the page with the current texts and modules built in */
function buildUpdatedPage(){
  const js=o=>JSON.stringify(o,null,2).replace(/</g,"\\u003c");
  const company={...ORIGINAL_COMPANY};for(const k of TEXT_FIELDS)company[k]=COMPANY[k];
  const ver=Date.now().toString(36);
  let src=PAGE_SOURCE
    .replace(/\/\*@COMPANY\*\/[\s\S]*?\/\*@END\*\//,()=>"/*@COMPANY*/"+js(company)+"/*@END*/")
    .replace(/\/\*@MODULES\*\/[\s\S]*?\/\*@END\*\//,()=>"/*@MODULES*/"+js(modules)+"/*@END*/")
    .replace(/\/\*@VER\*\/[\s\S]*?\/\*@END\*\//,()=>"/*@VER*/"+JSON.stringify(ver)+"/*@END*/");
  return src;
}
$("#dlBtn").onclick=()=>{
  try{
    const blob=new Blob([buildUpdatedPage()],{type:"text/html"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="index.html";
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("Downloaded index.html. Replace the file on your server so everyone sees the changes.");
  }catch(e){toast("This browser blocked the download. Open the page directly in Chrome or Edge and try again.");}
};

function openModal(html,onMount){
  const root=$("#modalRoot");
  root.innerHTML=`<div class="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const close=()=>{root.innerHTML="";document.removeEventListener("keydown",esc_);};
  const esc_=e=>{if(e.key==="Escape")close();};
  document.addEventListener("keydown",esc_);
  root.querySelector(".scrim").addEventListener("click",e=>{if(e.target===e.currentTarget)close();});
  root.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  onMount(root,close);
  const form=root.querySelector("form");
  if(form&&form.onsubmit){
    const handler=form.onsubmit;let busy=false;
    const run=async()=>{if(busy)return;busy=true;try{await handler({preventDefault(){}});}finally{busy=false;}};
    form.onsubmit=e=>{e.preventDefault();run();};
    root.querySelectorAll("[data-submit]").forEach(b=>b.addEventListener("click",run));
    form.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();run();}});
  }
}

let failCount=0,lockUntil=0;
function loginForm(after){
  openModal(`<header>Log in</header>
    <form id="lf" autocomplete="on">
      <div class="field"><label for="lu">Username</label><input id="lu" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"></div>
      <div class="err" id="lerr" role="alert"></div>
      <div class="mfoot"><div class="r"><button class="nbtn" type="button" data-close>Cancel</button><button class="nbtn primary" type="button" data-submit>Log in</button></div></div>
    </form>`,(root,close)=>{
      const u=root.querySelector("#lu"),p=root.querySelector("#lp"),err=root.querySelector("#lerr");u.focus();
      root.querySelector("#lf").onsubmit=async e=>{e.preventDefault();
        const now=Date.now();
        if(now<lockUntil){err.textContent=`Too many attempts. Try again in ${Math.ceil((lockUntil-now)/1000)} seconds.`;return;}
        const name=u.value.trim().toLowerCase();
        const pw=p.value.trim();
        if(!name||!pw){err.textContent="Enter your username and password.";return;}
        const h=await hashPassword(name,pw);
        const acc=ACCOUNTS.find(a=>a.username.toLowerCase()===name&&a.hash===h);
        if(!acc){
          failCount++;if(failCount>=5){lockUntil=Date.now()+30000;failCount=0;}
          err.textContent="Username or password is incorrect.";p.value="";p.focus();return;
        }
        failCount=0;session={username:acc.username,name:acc.name,role:acc.role};saveSession();
        close();render();toast(`Logged in as ${acc.name} (${acc.role==="admin"?"Admin":"User"})`);
        if(typeof after==="function")after();
      };
    });
}

function moduleForm(idx){
  const m=idx>=0?modules[idx]:{title:"",desc:"",icon:"pulse",color:"teal",status:"active",url:""};
  let icon=m.icon,color=m.color;
  openModal(`<header>${idx>=0?"Edit module":"Add module"}</header>
    <form id="mf">
      <div class="field"><label for="m-title">Module name *</label><input id="m-title" maxlength="60" value="${esc(m.title)}"></div>
      <div class="field"><label for="m-desc">Description</label><textarea id="m-desc" maxlength="240">${esc(m.desc)}</textarea></div>
      <div class="field"><label for="m-url">Link (URL the “Open Module” button opens)</label><input id="m-url" placeholder="https://… or page.html" value="${esc(m.url)}"></div>
      <div class="two">
        <div class="field"><label for="m-status">Status</label><select id="m-status">${STATUSES.map(s=>`<option value="${s.k}" ${s.k===m.status?"selected":""}>${s.label}</option>`).join("")}</select></div>
        <div class="field"><span>Colour</span><div class="swatches" id="sw">${Object.entries(COLORS).map(([k,v])=>`<button type="button" data-c="${k}" style="--sw:${v.c}" aria-label="${k}" aria-pressed="${k===color}"></button>`).join("")}</div></div>
      </div>
      <div class="field"><span>Icon</span><div class="icons" id="ic">${Object.keys(ICONS).map(k=>`<button type="button" data-i="${k}" aria-label="${k}" aria-pressed="${k===icon}">${svg(k)}</button>`).join("")}</div></div>
      <div class="err" id="merr" role="alert"></div>
      <div class="mfoot">
        ${idx>=0?`<button class="nbtn danger" type="button" id="del">Delete module</button>`:""}
        <div class="r"><button class="nbtn" type="button" data-close>Cancel</button><button class="nbtn primary" type="button" data-submit>Save</button></div>
      </div>
    </form>`,(root,close)=>{
      root.querySelector("#m-title").focus();
      root.querySelector("#sw").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;color=b.dataset.c;root.querySelectorAll("#sw button").forEach(x=>x.setAttribute("aria-pressed",x===b));};
      root.querySelector("#ic").onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;icon=b.dataset.i;root.querySelectorAll("#ic button").forEach(x=>x.setAttribute("aria-pressed",x===b));};
      const del=root.querySelector("#del");let armed=false;
      if(del)del.onclick=()=>{if(!armed){armed=true;del.classList.add("armed");del.textContent="Click again to delete";return;}
        modules.splice(idx,1);save();close();render();toast("Module deleted");};
      root.querySelector("#mf").onsubmit=e=>{e.preventDefault();
        const title=root.querySelector("#m-title").value.trim();
        if(!title){root.querySelector("#merr").textContent="Module name is required.";return;}
        const rawUrl=root.querySelector("#m-url").value.trim();
        if(rawUrl&&!safeUrl(rawUrl)){root.querySelector("#merr").textContent="Enter a web address starting with https:// or a page name like tracker.html.";return;}
        const data={title,desc:root.querySelector("#m-desc").value.trim(),url:rawUrl,status:root.querySelector("#m-status").value,icon,color};
        if(idx>=0)modules[idx]={...modules[idx],...data};else modules.push({id:"m"+Date.now().toString(36),...data});
        save();close();render();toast(idx>=0?"Module updated":"Module added");};
    });
}

function toast(msg){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2600);}

applyBrand();render();
</script>
</body>
</html>
